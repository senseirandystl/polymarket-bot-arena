; Pragmatic mypy baseline for the arena.
;
; The core business-logic modules are annotated and type-clean under these
; settings. Third-party stubs are absent for py-clob-client / websocket, so
; ignore_missing_imports keeps the noise down without weakening our own checks.
;
; NOTE: `arena.py` (the coordinator script) and `arena/` (the package) share a
; name, which mypy's module resolver cannot hold at once. Check them in two
; passes:
;
;   mypy db.py config.py learning.py http_client.py polymarket_fills.py \
;        polymarket_markets.py polymarket_client.py credentials_store.py \
;        bots signals venues
;   mypy --explicit-package-bases arena
;
[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
; Untyped function bodies are not fully checked yet (incremental adoption) —
; signatures and annotated modules are. Ratchet this on per-module over time.
check_untyped_defs = False

; Test files and one-off tools are exempt from the baseline for now.
[mypy-tests.*]
ignore_errors = True

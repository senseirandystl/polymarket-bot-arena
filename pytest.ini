[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -q
markers =
    unit: fast, isolated unit tests (tests/unit/)
    integration: cross-module flows — dashboard server, paper-cycle, pipelines (tests/integration/)
    slow: long-running tests (excluded via -m "not slow")
filterwarnings =
    ignore::DeprecationWarning:starlette.*
